{% block content %}
<style>
    /*NOTE: this is not optimizied for small screens*/
    html,
    body {
        margin: 0;
        padding: 0.0rem;
        width: 100%;
        min-height: 100vh;
        overflow: visible;
        background: #f9f9f9;
    }

    .full-screen-container {
        background: #f9f9f9;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 5 rem;
        font-size: 1.3rem
    }

    .card.card-intro {
    border: none;
    border-radius: none;
    background: none; /* Remove background and borders */
    max-width: 1000px;
    padding: 3 rem; 
    box-sizing: border-box;
  }

   p {
    margin: 0.3em ;   /* Was 0.6em previously */
  }

  .btn-primary {
    background-color: #2c3e50;
    border-color: #2c3e50;
    font-weight: 700;
    font-size: 1 em;   /* Slightly smaller than 0.95em */
    padding: 6px 14px;  /* Reduced padding */
    transition: background-color 0.2s ease;
  }

  .btn-primary:hover,
  .btn-primary:focus,
  .btn-primary:active {
    background-color: #243645;
    border-color: #243645;
  }

  .do-not-show {
    display: none;
}

</style>

<div class = "full-screen-container">
    <h2>Instructions</h2>
    <div class ="card card-intro">
        <p>
            You will now play the game with a sequence of five digits. 
            Remember, the more points you earn, the more likely you are to receive the bonus.
        </p>
    </div>
    <button style="margin-top: 2em" class="otree-btn-next btn btn-primary">Continue</button>
</div>
{% endblock %}
